<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Videos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const GOOGLE_DRIVE_FOLDER_ID = '1hcXExpuqZH84vG0n7Hhei50scw9giMf2';
        const GOOGLE_API_KEY = 'AIzaSyAKpkYhdnEPsEqXnPG8KN8lZbVH-fj74AE';

        function DriveVideosPage() {
            const [videos, setVideos] = useState([]);
            const [loading, setLoading] = useState(false);
            const [search, setSearch] = useState('');
            const [bookFilter, setBookFilter] = useState('');
            const [sortBy, setSortBy] = useState('dateDesc');
            const [activeVideos, setActiveVideos] = useState({});

            const fetchVideos = async () => {
                setLoading(true);
                const query = `'${GOOGLE_DRIVE_FOLDER_ID}' in parents and mimeType contains 'video' and trashed = false`;
                const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=files(id,name,createdTime)&key=${GOOGLE_API_KEY}`;
                
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    if (data.files) {
                        const parsed = data.files.map(f => {
                            const bMatch = f.name.match(/(?:bk|book)[\s_-]*(\d+)/i);
                            const pMatch = f.name.match(/(?:pg|page)[\s_-]*(\d+)/i);
                            return {
                                ...f,
                                book: bMatch ? parseInt(bMatch[1]) : 999,
                                page: pMatch ? parseInt(pMatch[1]) : 999,
                                date: new Date(f.createdTime)
                            };
                        });
                        setVideos(parsed);
                    }
                } catch (err) {
                    console.error("Error fetching videos:", err);
                } finally { 
                    setLoading(false); 
                }
            };

            useEffect(() => { fetchVideos(); }, []);

            const filtered = videos.filter(v => 
                v.name.toLowerCase().includes(search.toLowerCase()) &&
                (bookFilter === '' || v.book.toString() === bookFilter)
            ).sort((a, b) => {
                if (sortBy === 'book') return a.book - b.book || a.page - b.page;
                return sortBy === 'dateDesc' ? b.date - a.date : a.date - b.date;
            });

            const toggleVideoPlay = (id) => {
                setActiveVideos(prev => ({ ...prev, [id]: true }));
            };

            return (
                <div className="max-w-4xl mx-auto p-3 sm:p-6">
                    {/* Header Bar */}
                    <div className="flex flex-col sm:flex-row justify-between items-center mb-5 gap-3">
                        <div className="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                            <a href="index.html" className="text-blue-600 font-bold hover:underline text-sm sm:text-base">← Back to Hub</a>
                            <a 
                                href="https://docs.google.com/spreadsheets/d/1wOFUHSGLRZMrSmRR4vL2HWrA3hOPMcFGbYN4eX-5Uoc/edit?gid=917908271#gid=917908271" 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-medium transition text-xs sm:text-sm shadow-sm flex items-center gap-1.5"
                            >
                                📊 View Spreadsheet
                            </a>
                        </div>
                        <h1 className="text-xl sm:text-2xl font-bold text-slate-800 text-center">Kids Videos</h1>
                        <button 
                            onClick={fetchVideos} 
                            className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition w-full sm:w-auto text-sm shadow-sm"
                        >
                            {loading ? 'Loading...' : 'Refresh Library'}
                        </button>
                    </div>

                    {/* Responsive Search & Control Bar */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col gap-3">
                        <input 
                            placeholder="Search by video name..." 
                            className="border border-slate-300 p-3 rounded-lg w-full text-base bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                            value={search}
                            onChange={e => setSearch(e.target.value)} 
                        />
                        <div className="flex flex-col sm:flex-row gap-3 w-full">
                            <input 
                                placeholder="Filter Book #" 
                                type="number" 
                                className="border border-slate-300 p-3 rounded-lg w-full sm:w-1/3 text-base bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                value={bookFilter}
                                onChange={e => setBookFilter(e.target.value)} 
                            />
                            <select 
                                className="border border-slate-300 p-3 rounded-lg bg-white w-full sm:w-2/3 text-base focus:outline-none focus:ring-2 focus:ring-blue-500" 
                                value={sortBy}
                                onChange={e => setSortBy(e.target.value)}
                            >
                                <option value="dateDesc">Newest First</option>
                                <option value="book">Book & Page Order</option>
                            </select>
                        </div>
                    </div>

                    {loading && <div className="text-center p-10 text-slate-500 font-medium">Updating library...</div>}
                    
                    {!loading && filtered.length === 0 && (
                        <div className="text-center p-10 bg-white rounded-xl border border-slate-200 text-slate-500">
                            No videos found matching your filters.
                        </div>
                    )}

                    {/* Video Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {filtered.map(v => (
                            <div key={v.id} className="bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between">
                                <p className="font-semibold text-slate-800 text-sm sm:text-base mb-3 break-words line-clamp-2" title={v.name}>{v.name}</p>
                                
                                {/* Video Container with exact portrait orientation and single native stream player */}
                                <div className="w-full relative aspect-[3/4] sm:aspect-[4/5] rounded-xl overflow-hidden bg-slate-900 border border-slate-800 block shadow-inner">
                                    {activeVideos[v.id] ? (
                                        <div className="absolute inset-0 w-full h-full bg-black overflow-hidden flex items-center justify-center">
                                            <video 
                                                className="w-full h-full object-contain bg-black"
                                                src={`https://www.googleapis.com/drive/v3/files/${v.id}?alt=media&key=${GOOGLE_API_KEY}`}
                                                controls
                                                autoPlay
                                                playsInline
                                                webkit-playsinline="true"
                                                controlsList="nodownload"
                                            >
                                                Your browser does not support the video tag.
                                            </video>
                                        </div>
                                    ) : (
                                        <div 
                                            onClick={() => toggleVideoPlay(v.id)}
                                            className="absolute inset-0 cursor-pointer flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 hover:from-slate-700 hover:to-slate-800 transition p-4 text-center select-none"
                                        >
                                            <div className="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-xl mb-3 transform hover:scale-105 transition text-2xl font-bold">
                                                ▶
                                            </div>
                                            <span className="text-white text-base sm:text-lg font-bold">Tap to Play Video</span>
                                            <span className="text-slate-400 text-xs mt-1">Loads Single Clean Player</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DriveVideosPage />);
    </script>
</body>
</html>
