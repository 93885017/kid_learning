<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheriff Labrador Counting Adventures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        /* Force font everywhere to fix Android defaults */
        body, button, input, h1, h2, p, span, div { font-family: 'Fredoka One', cursive !important; }
        body { background-color: #f0f9ff; margin: 0; overflow-x: hidden; }
        .character-card { transition: all 0.3s ease; }
        .item-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes popAndFade {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1.5); opacity: 1; }
            80% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        @keyframes flashRed {
            0%, 100% { color: #374151; } 
            50% { color: #ef4444; } 
        }
        .score-flash { animation: flashRed 0.6s ease-in-out; }
        
        .char-img { 
            width: 120px; 
            height: 120px; 
            object-fit: contain; 
            border-radius: 50%; 
            margin: 0 auto; 
            border: 4px solid #fff; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); 
            background-color: #e0f2fe; 
            padding: 4px;
        }

        /* Strict hiding for Android browsers */
        .hidden-strict { display: none !important; }
        
        /* Container to hide everything until profile is picked */
        #app-container { display: none; width: 100%; flex-direction: column; align-items: center; }
    </style>
</head>
<body class="min-h-screen">

    <!-- STRICT LAYER SEPARATION: Modal must block everything below it -->
    <div id="profile-modal" class="fixed inset-0 bg-blue-50 z-[100] flex flex-col items-center justify-center p-4 transition-opacity duration-500 w-full h-full">
        <h1 class="text-4xl sm:text-5xl font-bold text-blue-600 mb-8 drop-shadow-md text-center">Who is playing today?</h1>
        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-2xl justify-center items-center">
            
            <button onclick="selectProfile('timtim')" class="bg-white border-4 border-green-400 p-6 sm:p-8 rounded-3xl shadow-xl w-64 transform transition hover:scale-105 flex flex-col items-center gap-4 group cursor-pointer">
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-5xl group-hover:animate-bounce shadow-inner border-2 border-green-200">👶</div>
                <h2 class="text-3xl font-bold text-green-600 m-0">Tim Tim</h2>
                <div class="text-center">
                    <p class="text-green-800 font-bold text-lg mb-1 m-0">Toddler Mode</p>
                    <p class="text-gray-500 font-medium text-sm m-0">Choose your own games!</p>
                </div>
            </button>
            
            <button onclick="selectProfile('luna')" class="bg-white border-4 border-purple-400 p-6 sm:p-8 rounded-3xl shadow-xl w-64 transform transition hover:scale-105 flex flex-col items-center gap-4 group cursor-pointer">
                <div class="w-24 h-24 bg-purple-100 rounded-full flex items-center justify-center text-5xl group-hover:animate-bounce shadow-inner border-2 border-purple-200">👧</div>
                <h2 class="text-3xl font-bold text-purple-600 m-0">Luna</h2>
                <div class="text-center">
                    <p class="text-purple-800 font-bold text-lg mb-1 m-0">Smart Girl Mode</p>
                    <p class="text-gray-500 font-medium text-sm m-0">Random Math Challenge!</p>
                </div>
            </button>
            
        </div>
    </div>

    <!-- Wrapped everything in a single container that starts hidden -->
    <div id="app-container" class="p-4 w-full max-w-4xl mx-auto">
        
        <header class="text-center mb-4 w-full max-w-2xl mx-auto">
            <h1 class="text-3xl md:text-5xl text-blue-600 mb-4 drop-shadow-sm">Sheriff Labrador Math</h1>

            <div class="flex justify-center gap-1 sm:gap-2 bg-white p-2 rounded-full shadow-sm border border-blue-100 w-fit mx-auto flex-wrap transition-all duration-300" id="tab-container">
                <button id="tab-counting" onclick="attemptSwitchTab('counting')" class="bg-blue-500 text-white px-4 sm:px-6 py-2 rounded-full font-bold text-sm sm:text-lg transition transform hover:scale-105">Counting</button>
                <button id="tab-addition" onclick="attemptSwitchTab('addition')" class="text-gray-500 bg-transparent hover:bg-blue-50 px-4 sm:px-6 py-2 rounded-full font-bold text-sm sm:text-lg transition transform hover:scale-105">Addition</button>
                <button id="tab-videos" onclick="attemptSwitchTab('videos')" class="text-gray-500 bg-transparent hover:bg-blue-50 px-4 sm:px-6 py-2 rounded-full font-bold text-sm sm:text-lg transition transform hover:scale-105">Reward Video</button>
            </div>
        </header>

        <!-- Score & Level Progress Bar -->
        <div class="w-full max-w-md mx-auto bg-white rounded-full h-8 mb-4 border-2 border-blue-200 overflow-hidden relative shadow-md sticky top-2 z-20">
            <div id="score-fill" class="bg-yellow-400 h-full transition-all duration-500" style="width: 0%;"></div>
            <div class="absolute inset-0 flex justify-between px-4 items-center font-bold text-gray-700 pointer-events-none">
                <span id="score-text">Score: 0</span>
                <span id="level-text">Level 1</span>
            </div>
        </div>

        <main id="section-counting" class="max-w-2xl w-full flex-col items-center gap-4 sm:gap-6 flex mx-auto">
            <p class="text-lg text-gray-500 -mt-2 mb-2 font-medium">How many friends do you see?</p>
            
            <div id="game-container" class="w-full bg-white p-6 rounded-3xl shadow-xl border-t-8 border-blue-400 text-center relative">
                <div class="w-full h-2 bg-gray-100 rounded-full mb-4 overflow-hidden">
                    <div class="question-timer-fill h-full w-full bg-green-500"></div>
                </div>

                <div class="mb-6 flex justify-center gap-2">
                    <button id="btn-5" onclick="attemptSetDifficulty(5)" class="diff-btn bg-blue-600 text-white px-4 py-2 rounded-full font-bold shadow-md transition transform hover:scale-105">1 - 5</button>
                    <button id="btn-10" onclick="attemptSetDifficulty(10)" class="diff-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full font-bold shadow-md transition transform hover:scale-105">1 - 10</button>
                    <button id="btn-20" onclick="attemptSetDifficulty(20)" class="diff-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full font-bold shadow-md transition transform hover:scale-105">1 - 20</button>
                </div>

                <div id="character-display" class="mb-6">
                    <div id="char-icon" class="block mb-2 min-h-[120px]"></div>
                    <h2 id="char-name" class="text-2xl text-blue-800 m-0">...</h2>
                </div>

                <div id="frame-container" class="grid grid-cols-5 gap-2 sm:gap-3 mb-8 p-4 bg-blue-50 rounded-2xl min-h-[120px] w-fit mx-auto place-items-center">
                </div>

                <div id="counting-options" class="flex flex-wrap justify-center gap-3 sm:gap-6 mb-6">
                </div>

                <div id="count-next-container" class="hidden-strict flex-col items-center mt-4 h-16">
                </div>
            </div>
        </main>

        <main id="section-addition" class="max-w-2xl w-full flex-col items-center gap-4 sm:gap-6 hidden-strict mx-auto">
            <p class="text-lg text-gray-500 -mt-2 mb-2 font-medium">Let's add them together!</p>
            
            <div class="w-full bg-white p-4 sm:p-6 rounded-3xl shadow-xl border-t-8 border-green-400 text-center relative">
                <div class="w-full h-2 bg-gray-100 rounded-full mb-4 overflow-hidden">
                    <div class="question-timer-fill h-full w-full bg-green-500"></div>
                </div>

                <div class="mb-6 flex justify-center gap-2">
                    <button id="add-btn-random" onclick="attemptSetAdditionMode('random')" class="add-mode-btn bg-green-600 text-white px-4 py-2 rounded-full font-bold shadow-md transition transform hover:scale-105">Random</button>
                    <button id="add-btn-doubles" onclick="attemptSetAdditionMode('doubles')" class="add-mode-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full font-bold shadow-md transition transform hover:scale-105">Same Numbers</button>
                </div>

                <div id="addition-character-display" class="mb-4">
                    <h2 id="add-char-name" class="text-2xl text-green-800 mb-4 m-0">...</h2>
                </div>

                <div class="flex flex-wrap justify-center items-center gap-2 sm:gap-4 mb-8">
                    <div id="add-frame-a" class="grid grid-cols-5 gap-1 p-2 sm:p-3 bg-green-50 rounded-2xl place-items-center border-2 border-green-200 shadow-inner">
                    </div>
                    
                    <div class="text-3xl sm:text-5xl text-green-600 font-bold">+</div>
                    
                    <div id="add-frame-b" class="grid grid-cols-5 gap-1 p-2 sm:p-3 bg-green-50 rounded-2xl place-items-center border-2 border-green-200 shadow-inner">
                    </div>

                    <div class="text-3xl sm:text-5xl text-green-600 font-bold">=</div>

                    <div id="add-result-box" class="w-14 h-14 sm:w-20 sm:h-20 bg-gray-100 rounded-2xl border-4 border-dashed border-gray-300 flex items-center justify-center text-3xl sm:text-5xl text-gray-400 font-bold transition-all duration-300">
                        ?
                    </div>
                </div>

                <div id="addition-options" class="flex flex-wrap justify-center gap-3 sm:gap-6 mb-6">
                </div>

                <div id="add-next-container" class="hidden-strict flex-col items-center mt-6 h-16">
                </div>
            </div>
        </main>

        <main id="section-videos" class="max-w-4xl w-full flex-col items-center gap-6 hidden-strict mx-auto">
            <p class="text-lg text-gray-500 -mt-4 mb-2 font-medium">Choose your level-up reward video!</p>
            <div class="w-full bg-white p-6 rounded-3xl shadow-xl border-t-8 border-yellow-400">
                <div class="flex justify-center mb-6">
                    <button id="fetch-videos-btn" onclick="fetchLatestVideos()" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full shadow-md transition transform hover:scale-105 flex items-center gap-2">
                        <svg class="w-5 h-5 inline-block" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"></path></svg>
                        Fetch Latest Uploads
                    </button>
                </div>
                <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                </div>
            </div>
        </main>
    </div> <!-- End app container -->

    <div id="drawing-modal" class="fixed inset-0 bg-white/95 z-[150] hidden-strict flex-col items-center justify-center p-4 transition-opacity duration-500 w-full h-full">
        <h2 class="text-4xl sm:text-5xl font-bold text-blue-500 mb-6 animate-bounce text-center drop-shadow-sm m-0">Draw the Number!</h2>
        <div class="relative">
            <canvas id="drawing-canvas" class="bg-gray-50 border-4 border-dashed border-blue-300 rounded-3xl cursor-crosshair touch-none shadow-inner"></canvas>
            <div id="drawing-success" class="absolute inset-0 hidden-strict items-center justify-center pointer-events-none w-full h-full">
                <div class="text-[8rem] sm:text-[12rem] animate-ping text-yellow-400 font-bold leading-none">✨</div>
            </div>
        </div>
        
        <div class="mt-8 w-full max-w-sm bg-gray-200 rounded-full h-6 shadow-inner border-2 border-gray-300 relative overflow-hidden">
            <div id="drawing-progress" class="bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 h-full rounded-full transition-all duration-100" style="width: 0%"></div>
        </div>
        <p class="text-gray-500 mt-3 text-lg font-bold m-0">Use your finger to color it in!</p>
    </div>

    <div id="video-modal" class="fixed inset-0 bg-black/90 hidden-strict z-[200] flex-col items-center justify-center p-4 w-full h-full">
        <h2 class="text-4xl font-bold text-yellow-400 mb-6 animate-bounce text-center drop-shadow-md m-0">Level Up! Reward Time!</h2>
        <div class="w-full max-w-4xl aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl mb-8 border-4 border-yellow-400 relative">
            <div id="video-overlay" class="absolute inset-0 z-10 cursor-pointer" onclick="forcePlayVideo()">
                <div id="play-prompt" class="hidden-strict w-full h-full flex flex-col items-center justify-center bg-black/60">
                    <button class="bg-red-600 text-white font-bold py-4 px-10 rounded-full text-3xl animate-pulse shadow-lg border-4 border-red-400">Tap to Play Video!</button>
                </div>
            </div>
            <div id="youtube-player-container" class="w-full h-full"></div>
        </div>
        <button onclick="closeVideoModal()" class="bg-blue-500 hover:bg-blue-400 text-white text-3xl font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.6)] transform transition hover:scale-105">Keep Playing!</button>
    </div>

    <!-- Load YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const characters = [
            { name: 'Officer Dobi', url: 'https://i.pinimg.com/736x/db/95/59/db9559c71e6b0c2703c485acb1a9842d.jpg' },
            { name: 'Officer Papillon', url: 'https://i.pinimg.com/736x/f8/90/5c/f8905c7c36695e7c85581948aad44b2f.jpg' },
            { name: 'Sheriff Labrador', url: 'https://yt3.googleusercontent.com/zfL5f9MJeyCXo6jG57hXRDtYapXOVsqx3G1HIYy4pAI2VxNjJ-GjisiQK491rv4fytVM2fotrg=s900-c-k-c0x00ffffff-no-rj' }
        ];

        let currentProfile = null; // 'timtim' or 'luna'
        let currentCount = 0;
        let timtimCounted = 0; 
        let maxCount = 5;
        let currentWrongAttempts = 0;
        let isGameActive = false; 

        // Scoring
        let score = 0;
        let currentLevel = 1;
        const POINTS_PER_CORRECT = 10;
        const POINTS_PER_WRONG = -3;
        
        let levelThresholds = [0, 0]; 
        let videoSegments = [null, null]; 
        let currentVideoStart = 0;
        
        let pointsNeededForNext = 50; 
        let accumulatedPoints = 0;
        let rewardDurationSeconds = 30; 
        
        for (let lvl = 2; lvl <= 50; lvl++) {
            accumulatedPoints += pointsNeededForNext;
            levelThresholds[lvl] = accumulatedPoints;
            videoSegments[lvl] = { start: currentVideoStart, end: currentVideoStart + rewardDurationSeconds };
            currentVideoStart += rewardDurationSeconds;
            pointsNeededForNext += 10; 
            rewardDurationSeconds = Math.min(rewardDurationSeconds + 5, 90); 
        }

        const CHANNEL_ID = 'UCXIvAXVdbUDzIFhVwB9RR-g'; // Official Sheriff Labrador Channel
        
        // Start with a small set of fallback videos before the user fetches the live ones
        let rewardVideos = [
            { id: 'IRHvaY8uB6w', title: 'Three Labradors' },
            { id: 'DbnRQtHSQQk', title: 'Kung Fu Training' },
            { id: 'wIWLp6YwKq8', title: 'Ultimate Rescue' },
            { id: 'k07D6NGaIqQ', title: 'Little Captain' },
            { id: '0mKkA1pg67Q', title: 'Sheriff from the Sky' },
            { id: 'Cd9VzqcLbnE', title: 'Superhero Fun House' }
        ];
        let selectedRewardVideoId = rewardVideos[0].id; 

        async function fetchLatestVideos() {
            const btn = document.getElementById('fetch-videos-btn');
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Fetching...`;
            }
            
            try {
                // Using rss2json to fetch latest YouTube channel uploads without an API key
                const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${CHANNEL_ID}`;
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.status === 'ok' && data.items && data.items.length > 0) {
                    rewardVideos = data.items.map(item => {
                        const videoId = item.guid.split(':').pop(); 
                        return { id: videoId, title: item.title };
                    }).slice(0, 6); // Keep the latest 6 videos
                    
                    selectedRewardVideoId = rewardVideos[0].id;
                }
            } catch (error) {
                console.error("Error fetching videos:", error);
                if (btn) {
                    btn.innerHTML = `⚠️ Fetch Failed`;
                    btn.classList.replace('bg-blue-500', 'bg-red-500');
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.classList.replace('bg-red-500', 'bg-blue-500');
                        btn.innerHTML = `<svg class="w-5 h-5 inline-block -mt-1 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"></path></svg> Refresh Latest Uploads`;
                    }, 3000);
                    return;
                }
            }

            if (btn) {
                btn.disabled = false;
                btn.innerHTML = `<svg class="w-5 h-5 inline-block -mt-1 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"></path></svg> Refresh Latest Uploads`;
            }
            
            initVideoSelection();
        }

        let isDrawing = false;
        let drawCtx = null;
        let drawPoints = 0;
        let drawTarget = 80; 
        let drawingLevelUp = false;
        let lastPos = null;

        function setupDrawingCanvas() {
            const canvas = document.getElementById('drawing-canvas');
            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDraw);
            canvas.addEventListener('mouseleave', endDraw);
            canvas.addEventListener('touchstart', startDraw, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', endDraw);
            canvas.addEventListener('touchcancel', endDraw);
        }

        function getCanvasPos(e) {
            const canvas = document.getElementById('drawing-canvas');
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDraw(e) {
            e.preventDefault(); 
            isDrawing = true;
            lastPos = getCanvasPos(e);
            draw(e); 
        }

        function endDraw(e) {
            if(e) e.preventDefault();
            isDrawing = false;
            lastPos = null;
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getCanvasPos(e);
            
            drawCtx.lineWidth = 60; 
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = `hsl(${(drawPoints * 5) % 360}, 80%, 55%)`; 
            
            drawCtx.beginPath();
            if (lastPos) drawCtx.moveTo(lastPos.x, lastPos.y);
            else drawCtx.moveTo(pos.x, pos.y);
            drawCtx.lineTo(pos.x, pos.y);
            drawCtx.stroke();
            
            lastPos = pos;
            drawPoints++;
            
            let progress = Math.min(100, (drawPoints / drawTarget) * 100);
            document.getElementById('drawing-progress').style.width = `${progress}%`;

            if (drawPoints >= drawTarget && isDrawing) {
                isDrawing = false; 
                document.getElementById('drawing-success').classList.remove('hidden-strict');
                document.getElementById('drawing-success').classList.add('flex');
                speakCantoneseNumber(currentCount); 
                setTimeout(completeDrawing, 1500); 
            }
        }
        
        function showDrawingCanvas(num, isLevelUp) {
            drawingLevelUp = isLevelUp;
            drawPoints = 0;
            lastPos = null;

            const modal = document.getElementById('drawing-modal');
            const canvas = document.getElementById('drawing-canvas');
            
            document.getElementById('drawing-success').classList.add('hidden-strict');
            document.getElementById('drawing-success').classList.remove('flex');
            
            modal.classList.remove('hidden-strict');
            modal.classList.add('flex');

            const size = Math.min(window.innerWidth - 40, 350);
            canvas.width = size;
            canvas.height = size;

            drawCtx = canvas.getContext('2d');
            drawCtx.clearRect(0, 0, canvas.width, canvas.height);

            drawCtx.globalCompositeOperation = 'source-over';
            drawCtx.font = `bold ${size * 0.8}px 'Fredoka One', cursive`;
            drawCtx.textAlign = 'center';
            drawCtx.textBaseline = 'middle';
            drawCtx.fillStyle = '#e2e8f0'; 
            drawCtx.fillText(num, canvas.width / 2, canvas.height / 2 + (size * 0.05)); 

            drawCtx.lineWidth = 4;
            drawCtx.setLineDash([15, 10]);
            drawCtx.strokeStyle = '#94a3b8';
            drawCtx.strokeText(num, canvas.width / 2, canvas.height / 2 + (size * 0.05));
            drawCtx.setLineDash([]); 

            drawCtx.globalCompositeOperation = 'source-atop';
            document.getElementById('drawing-progress').style.width = '0%';
        }

        function completeDrawing() {
            const modal = document.getElementById('drawing-modal');
            modal.classList.add('hidden-strict');
            modal.classList.remove('flex');
            drawCtx.globalCompositeOperation = 'source-over'; 
            if (drawingLevelUp) triggerLevelUp();
            else feedNextRandomGame();
        }

        function speakCantoneseNumber(num) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(num.toString());
                utterance.lang = 'zh-HK';

        let currentTimerTimeout;
        let questionStartTime = 0;
        let currentQuestionDuration = 3000;
        
        function startTimer(durationMs, timeoutCallback) {
            currentQuestionDuration = durationMs;
            questionStartTime = Date.now();
            
            clearTimeout(currentTimerTimeout);
            const timerEls = document.querySelectorAll('.question-timer-fill');
            
            timerEls.forEach(el => {
                el.style.transition = 'none';
                el.style.width = '100%';
                el.style.backgroundColor = '#22c55e';
            });

            void timerEls[0].offsetWidth;

            timerEls.forEach(el => {
                el.style.transition = `width ${durationMs}ms linear, background-color ${durationMs}ms linear`;
                el.style.width = '0%';
                el.style.backgroundColor = '#ef4444';
            });

            currentTimerTimeout = setTimeout(timeoutCallback, durationMs);
        }

        function stopTimer() {
            clearTimeout(currentTimerTimeout);
            const timerEls = document.querySelectorAll('.question-timer-fill');
            timerEls.forEach(el => {
                const currentWidth = el.offsetWidth;
                const parentWidth = el.parentElement.offsetWidth;
                el.style.transition = 'none';
                el.style.width = `${(currentWidth / parentWidth) * 100}%`;
            });
        }

        function handleTimeout(gameType) {
            isGameActive = false; 
            updateScore(POINTS_PER_WRONG);
            
            const containerId = gameType === 'counting' ? 'count-next-container' : 'add-next-container';

        function onPlayerStateChange(event) {

        function updateScore(points) {
            score += points;
            const scoreText = document.getElementById('score-text');
            scoreText.innerText = `Score: ${score}`;
            if (points < 0) {
                scoreText.classList.remove('score-flash');
                void scoreText.offsetWidth; 
                scoreText.classList.add('score-flash');
            }
            
            const currentBase = levelThresholds[currentLevel];
            let nextBase = levelThresholds[currentLevel + 1] || (currentBase + 100);
            
            const pointsNeeded = nextBase - currentBase;
            const pointsEarned = score - currentBase;
            
            let progress = (pointsEarned / pointsNeeded) * 100;
            if (progress < 0) progress = 0; 
            if (progress >= 100) progress = 100; 
            
            document.getElementById('score-fill').style.width = `${progress}%`;
            return (score >= nextBase && points > 0);
        }

        function triggerLevelUp() {
            currentLevel++;
            document.getElementById('level-text').innerText = `Level ${currentLevel}`;
            
            setTimeout(() => { 
                const currentBase = levelThresholds[currentLevel];
                const nextBase = levelThresholds[currentLevel + 1] || (currentBase + 100);
                const pointsEarned = score - currentBase;
                let carryOverProgress = (pointsEarned / (nextBase - currentBase)) * 100;
                if (carryOverProgress < 0) carryOverProgress = 0;
                if (carryOverProgress > 100) carryOverProgress = 100;
                document.getElementById('score-fill').style.width = `${carryOverProgress}%`;
            }, 500);

            const modal = document.getElementById('video-modal');
            const segment = videoSegments[currentLevel];

            modal.classList.remove('hidden-strict');
            modal.classList.add('flex');
            document.getElementById('play-prompt').classList.remove('hidden-strict');

            if (segment && ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
                ytPlayer.loadVideoById({
                    videoId: selectedRewardVideoId,
                    startSeconds: segment.start,
                    endSeconds: segment.end
                });
            }
        }

        function feedNextRandomGame() {
            if (currentProfile === 'timtim') {
                const countSec = document.getElementById('section-counting');
                if (!countSec.classList.contains('hidden-strict')) {
                    startNewRound();
                } else {
                    startAdditionRound();
                }
                return;
            }

            const modes = [
                { type: 'counting', diff: 5 }, { type: 'counting', diff: 10 }, { type: 'counting', diff: 20 },
                { type: 'addition', mode: 'random' }, { type: 'addition', mode: 'doubles' }
            ];
            
            let next;
            do { next = modes[Math.floor(Math.random() * modes.length)]; } 
            while (lastFeedMode && next.type === lastFeedMode.type && next.diff === lastFeedMode.diff && next.mode === lastFeedMode.mode);
            
            lastFeedMode = next;
            
            if (next.type === 'counting') {
                updateUITab('counting');
                updateUICountingDiff(next.diff);
                maxCount = next.diff;
                startNewRound();
            } else {
                updateUITab('addition');
                updateUIAdditionMode(next.mode);
                additionMode = next.mode;
                startAdditionRound();
            }
        }

        function startNewRound() {
            isGameActive = true; 
            currentWrongAttempts = 0; 
            timtimCounted = 0; 
            
            const nextContainer = document.getElementById('count-next-container');
            if (nextContainer) {
                nextContainer.classList.add('hidden-strict');

        function generateCountingOptions() {
            let options = [currentCount];
            while(options.length < 3) {
                let offset = Math.floor(Math.random() * 5) - 2; 
                let wrong = currentCount + offset;
                if (wrong <= 0) wrong = currentCount + Math.floor(Math.random() * 3) + 1;
                if(wrong !== currentCount && wrong > 0 && !options.includes(wrong)) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('counting-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "count-opt-btn bg-gray-200 hover:bg-blue-100 text-gray-800 text-2xl sm:text-4xl font-bold py-3 px-6 sm:px-8 rounded-2xl shadow-md border-b-4 border-gray-300 active:border-b-0 active:translate-y-1 transition-all";
                btn.innerText = opt;
                btn.onclick = () => checkCountingAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });

            const duration = (currentProfile === 'timtim') ? 15000 : 3000;
            startTimer(duration, () => handleTimeout('counting'));
        }

        function checkCountingAnswer(selected, btnElement) {
            stopTimer(); 

            if (selected === currentCount) {
                isGameActive = false; 

                const timeTaken = Date.now() - questionStartTime;
                const percentTimeLeft = Math.max(0, (currentQuestionDuration - timeTaken) / currentQuestionDuration);
                const earnedPoints = Math.max(2, Math.ceil(10 * percentTimeLeft));
                const isLevelUp = updateScore(earnedPoints);

                document.getElementById('current-count-text').innerText = currentCount;
                document.getElementById('count-pts').innerText = `+${earnedPoints} Points!`;
                
                if (currentProfile === 'timtim') {
                    speakCantoneseNumber(currentCount);
                    const popOut = document.createElement('div');
                    popOut.className = 'fixed inset-0 z-[200] flex items-center justify-center pointer-events-none';
                    popOut.innerHTML = `<div class="text-[10rem] sm:text-[14rem] text-yellow-400 font-bold drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)]" style="animation: popAndFade 2s forwards; -webkit-text-stroke: 4px white;">${currentCount}</div>`;
                    document.body.appendChild(popOut);
                    setTimeout(() => popOut.remove(), 2000);
                }

                const nextContainer = document.getElementById('count-next-container');
                nextContainer.classList.remove('hidden-strict');
                nextContainer.classList.add('flex');
                
                document.querySelectorAll('.count-opt-btn').forEach(b => {
                    b.disabled = true;
                    if(parseInt(b.innerText) === currentCount) b.className = "count-opt-btn bg-blue-500 text-white text-2xl sm:text-4xl font-bold py-3 px-6 sm:px-8 rounded-2xl shadow-md border-b-4 border-blue-700 transition-all";
                    else b.className = "count-opt-btn bg-gray-100 text-gray-300 text-2xl sm:text-4xl font-bold py-3 px-6 sm:px-8 rounded-2xl shadow-none transition-all cursor-not-allowed";
                });

                const frameContainer = document.getElementById('frame-container');
                const populatedSlots = Array.from(frameContainer.children).slice(0, currentCount);
                let groupCount = Math.ceil(currentCount / 5);
                
                setTimeout(() => {
                    for (let i = 0; i < groupCount; i++) {
                        setTimeout(() => {
                            let start = i * 5;
                            let end = Math.min(start + 5, currentCount);
                            let isLastGroup = (i === groupCount - 1);
                            let labelNumber = isLastGroup ? currentCount : end;
                            
                            for (let j = start; j < end; j++) {
                                let slot = populatedSlots[j];
                                slot.classList.remove('bg-white', 'border-blue-200', 'border-green-400');
                                slot.classList.add('bg-yellow-200', 'border-yellow-400', 'scale-110');
                                setTimeout(() => slot.classList.remove('scale-110'), 300);
                                
                                if (j === end - 1) {
                                    const badge = document.createElement('div');
                                    badge.className = "absolute -top-3 -right-3 bg-blue-500 text-white rounded-full w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center font-bold text-xs sm:text-sm z-10 item-pop shadow-md";
                                    badge.innerText = labelNumber;
                                    slot.appendChild(badge);
                                }
                            }
                        }, i * 800); 
                    }

                    setTimeout(() => {
                        if (currentProfile === 'timtim') showDrawingCanvas(currentCount, isLevelUp);
                        else {
                            if (isLevelUp) triggerLevelUp();
                            else feedNextRandomGame();
                        }
                    }, (groupCount * 800) + 1500);
                }, 500);

            } else {
                updateScore(POINTS_PER_WRONG);
                currentWrongAttempts++; 

                btnElement.classList.replace('bg-gray-200', 'bg-red-200');
                btnElement.classList.replace('hover:bg-blue-100', 'hover:bg-red-200');
                btnElement.classList.replace('border-gray-300', 'border-red-400');
                
                btnElement.disabled = true;
                btnElement.classList.add('opacity-50', 'cursor-not-allowed', 'animate-shake');

                setTimeout(() => {
                    btnElement.classList.remove('animate-shake');
                    if (currentWrongAttempts >= 2) {
                        isGameActive = false;
                        feedNextRandomGame();
                    } else {
                        const duration = (currentProfile === 'timtim') ? 15000 : 3000;
                        startTimer(duration, () => handleTimeout('counting'));
                    }
                }, 500); 
            }
        }

        let addCurrentA = 0; let addCurrentB = 0; let addCorrectSum = 0;

        function startAdditionRound() {
            isGameActive = true; 
            currentWrongAttempts = 0; 
            
            const addNextContainer = document.getElementById('add-next-container');
            if (addNextContainer) {
                addNextContainer.classList.add('hidden-strict');

            populateAddFrame('add-frame-a', addCurrentA);
            populateAddFrame('add-frame-b', addCurrentB);
            generateOptions();

        function populateAddFrame(elementId, count) {
            const container = document.getElementById(elementId);

        function generateOptions() {
            let options = [addCorrectSum];
            while(options.length < 3) {
                let offset = Math.floor(Math.random() * 6) - 3; 
                let wrong = addCorrectSum + offset;
                if(wrong !== addCorrectSum && wrong > 0 && !options.includes(wrong)) options.push(wrong);
            }
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('addition-options');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');

                btn.onclick = () => checkAdditionAnswer(opt, btn);

            });

            const duration = additionMode === 'doubles' ? 3000 : 6000;
            startTimer(duration, () => handleTimeout('addition'));

        function checkAdditionAnswer(selected, btnElement) {
            stopTimer(); 

            if (selected === addCorrectSum) {
                isGameActive = false; 

                const timeTaken = Date.now() - questionStartTime;
                const percentTimeLeft = Math.max(0, (currentQuestionDuration - timeTaken) / currentQuestionDuration);
                const earnedPoints = Math.max(2, Math.ceil(10 * percentTimeLeft));
                const isLevelUp = updateScore(earnedPoints);
                
                document.getElementById('add-pts').innerText = `+${earnedPoints} Points!`;
                document.getElementById('add-result-box').innerHTML = addCorrectSum;
                document.getElementById('add-result-box').className = "w-14 h-14 sm:w-20 sm:h-20 bg-green-500 rounded-2xl border-4 border-green-600 flex items-center justify-center text-3xl sm:text-5xl text-white font-bold item-pop shadow-lg";
                
                document.getElementById('add-next-container').classList.remove('hidden-strict');
                document.getElementById('add-next-container').classList.add('flex');
                
                document.querySelectorAll('.add-opt-btn').forEach(b => {
                    b.disabled = true;
                    if(parseInt(b.innerText) === addCorrectSum) b.className = "add-opt-btn bg-green-500 text-white text-2xl sm:text-4xl font-bold py-3 px-6 sm:px-8 rounded-2xl shadow-md border-b-4 border-green-700 transition-all";
                    else b.className = "add-opt-btn bg-gray-100 text-gray-300 text-2xl sm:text-4xl font-bold py-3 px-6 sm:px-8 rounded-2xl shadow-none transition-all cursor-not-allowed";
                });

                if (additionMode === 'doubles') {
                    setTimeout(() => {
                        if (isLevelUp) triggerLevelUp();
                        else feedNextRandomGame();
                    }, 2000);
                } else {
                    setTimeout(() => animateAddition(isLevelUp), 500); 
                }
            } else {
                updateScore(POINTS_PER_WRONG);
                currentWrongAttempts++; 

                btnElement.classList.replace('bg-gray-200', 'bg-red-200');
                btnElement.classList.replace('hover:bg-green-100', 'hover:bg-red-200');
                btnElement.classList.replace('border-gray-300', 'border-red-400');
                btnElement.disabled = true;
                btnElement.classList.add('opacity-50', 'cursor-not-allowed', 'animate-shake');

                setTimeout(() => {
                    btnElement.classList.remove('animate-shake');
                    if (currentWrongAttempts >= 2) {
                        isGameActive = false;
                        feedNextRandomGame();
                    } else {
                        const duration = additionMode === 'doubles' ? 3000 : 6000;
                        startTimer(duration, () => handleTimeout('addition'));
                    }
                }, 500);
            }
        }

        function animateAddition(isLevelUp) {
            const targetIsA = addCurrentA >= addCurrentB;
            const targetFrame = document.getElementById(targetIsA ? 'add-frame-a' : 'add-frame-b');
            const sourceFrame = document.getElementById(targetIsA ? 'add-frame-b' : 'add-frame-a');

            const requiredSlots = Math.max(10, Math.ceil(addCorrectSum / 5) * 5);
            while (targetFrame.children.length < requiredSlots) {
                const emptySlot = document.createElement('div');
                emptySlot.className = 'relative border-2 border-green-200 rounded-lg flex items-center justify-center bg-white shadow-sm w-7 h-7 sm:w-10 sm:h-10 transition-all duration-500 opacity-0';
                targetFrame.appendChild(emptySlot);
                setTimeout(() => emptySlot.classList.remove('opacity-0'), 50); 
            }

            const slotsTarget = Array.from(targetFrame.children);
            const emptySlotsTarget = slotsTarget.filter(slot => !slot.querySelector('img'));
            const imagesSource = Array.from(sourceFrame.querySelectorAll('img'));

            const moveCount = imagesSource.length;
            let currentIndex = 0;

            function moveNextItem() {
                if (currentIndex >= moveCount) {
                    targetFrame.classList.add('shadow-lg', 'border-green-400', 'transition-all', 'duration-500');
                    sourceFrame.classList.add('opacity-30', 'transition-all', 'duration-500'); 
                    
                    const populatedSlots = Array.from(targetFrame.children).slice(0, addCorrectSum);
                    let groupCount = Math.ceil(addCorrectSum / 5);
                    
                    for (let i = 0; i < groupCount; i++) {
                        setTimeout(() => {
                            let start = i * 5;
                            let end = Math.min(start + 5, addCorrectSum);
                            let isLastGroup = (i === groupCount - 1);
                            let labelNumber = isLastGroup ? addCorrectSum : end;
                            
                            for (let j = start; j < end; j++) {
                                let slot = populatedSlots[j];
                                slot.classList.remove('bg-white', 'border-green-200');
                                slot.classList.add('bg-yellow-200', 'border-yellow-400', 'scale-110');
                                setTimeout(() => slot.classList.remove('scale-110'), 300);
                                
                                if (j === end - 1) {
                                    const badge = document.createElement('div');
                                    badge.className = "absolute -top-3 -right-3 bg-blue-500 text-white rounded-full w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center font-bold text-xs sm:text-sm z-10 item-pop shadow-md";
                                    badge.innerText = labelNumber;
                                    slot.appendChild(badge);
                                }
                            }
                        }, i * 800); 
                    }
                    
                    setTimeout(() => {
                        targetFrame.classList.remove('shadow-lg', 'border-green-400');
                        sourceFrame.classList.remove('opacity-30');
                        if (isLevelUp) triggerLevelUp();
                        else feedNextRandomGame();
                    }, (groupCount * 800) + 1500);

                    return;
                }

                const targetSlot = emptySlotsTarget[currentIndex];
                const sourceImg = imagesSource[currentIndex];

                if (!targetSlot || !sourceImg) {
                    currentIndex++;
                    moveNextItem();
                    return;
                }

                const sourceRect = sourceImg.getBoundingClientRect();
                const targetRect = targetSlot.getBoundingClientRect();

                const clone = sourceImg.cloneNode(true);
                clone.style.position = 'fixed';
                clone.style.left = sourceRect.left + 'px';
                clone.style.top = sourceRect.top + 'px';
                clone.style.width = sourceRect.width + 'px';
                clone.style.height = sourceRect.height + 'px';
                clone.style.margin = '0';
                clone.style.transition = 'all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1)';
                clone.style.zIndex = '9999';
                
                document.body.appendChild(clone);
                sourceImg.style.opacity = '0';

                clone.offsetHeight; 
                clone.style.left = targetRect.left + 'px';
                clone.style.top = targetRect.top + 'px';

                setTimeout(() => {
                    clone.remove();
                    targetSlot.innerHTML = `<img src="${sourceImg.src}" class="${sourceImg.className} item-pop" alt="item">`;
                    sourceImg.remove();
                    currentIndex++;
                    setTimeout(moveNextItem, 150); 
                }, 400); 
            }

            if (moveCount > 0) moveNextItem();
            else {
                setTimeout(() => {
                    if (isLevelUp) triggerLevelUp();
                    else feedNextRandomGame();
                }, 2000);
            }
        }

        function initVideoSelection() {
            const grid = document.getElementById('video-grid');
            
            if (rewardVideos.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-500 font-bold text-2xl py-10 animate-pulse">📡 Fetching latest videos from YouTube...</div>';
                return;
            }
            grid.innerHTML = '';
            
            rewardVideos.forEach(vid => {
                const isSelected = vid.id === selectedRewardVideoId;
                const card = document.createElement('div');
                card.className = `cursor-pointer rounded-2xl overflow-hidden transition-all duration-300 transform hover:scale-105 border-4 ${isSelected ? 'border-yellow-400 shadow-xl scale-105' : 'border-transparent shadow-md'}`;
                card.onclick = () => selectVideo(vid.id);
                card.id = `video-card-${vid.id}`;
                
                card.innerHTML = `
                    <div class="relative w-full aspect-video">
                        <img src="https://img.youtube.com/vi/${vid.id}/hqdefault.jpg" alt="${vid.title}" class="w-full h-full object-cover">
                        ${isSelected ? '<div class="absolute inset-0 bg-yellow-400/20 flex items-center justify-center"><span class="bg-yellow-400 text-white font-bold px-4 py-2 rounded-full text-xl shadow-lg border-2 border-white">Selected!</span></div>' : ''}
                    </div>
                    <div class="p-3 bg-gray-50 text-center font-bold text-gray-700">${vid.title}</div>
                `;
                grid.appendChild(card);
            });
        }

        function selectVideo(id) {
            selectedRewardVideoId = id;
            initVideoSelection(); 
        }

        window.onload = () => {
            initVideoSelection(); // Show loading text
            fetchLatestVideos();  // Fetch newest videos
            setupDrawingCanvas();
        };
    </script>
</body>
</html>
