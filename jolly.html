<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Phonics Routine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-12 selection:bg-blue-100">

    <header class="bg-white shadow-sm py-6 px-6 mb-8 text-center border-b-4 border-blue-400">
        <h1 class="text-3xl font-extrabold text-slate-800 flex items-center justify-center gap-2">
            <i data-lucide="star" class="text-yellow-400 fill-yellow-400"></i>
            Phonics Daily
        </h1>
        <p class="text-slate-500 mt-2 font-medium">Select a letter to begin today's adventure!</p>
    </header>

    <main class="max-w-3xl mx-auto px-4">
        <section class="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-sm uppercase tracking-widest font-bold mb-4 text-center text-slate-400">Choose a Letter</h2>
            <div id="letterSelector" class="flex flex-wrap justify-center gap-3"></div>
        </section>

        <div class="space-y-8">
            <div class="text-center">
                <h2 class="text-5xl font-black text-slate-800 flex items-center justify-center gap-3">
                    Letter <span id="currentLetterDisplay" class="px-6 py-2 rounded-2xl text-white shadow-xl bg-red-400">G</span>
                </h2>
            </div>

            <article id="songSection" class="bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-100">
                <div class="bg-blue-50 py-4 px-6 flex items-center gap-3">
                    <div class="p-2 bg-blue-100 rounded-lg text-blue-600"><i data-lucide="music"></i></div>
                    <h3 class="text-xl font-bold text-blue-900">Step 1: Sing Together</h3>
                </div>
                <div class="p-6">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-inner bg-slate-100">
                        <iframe id="songFrame" class="absolute top-0 left-0 w-full h-full" src="" title="Song" allowFullScreen></iframe>
                    </div>
                </div>
            </article>

            <article id="bookSection" class="bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-100">
                <div class="bg-emerald-50 py-4 px-6 flex items-center gap-3">
                    <div class="p-2 bg-emerald-100 rounded-lg text-emerald-600"><i data-lucide="book-open"></i></div>
                    <h3 class="text-xl font-bold text-emerald-900">Step 2: Read Story</h3>
                </div>
                <div class="p-6">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-inner bg-slate-100">
                        <iframe id="bookFrame" class="absolute top-0 left-0 w-full h-full" src="" title="Story" allowFullScreen></iframe>
                    </div>
                </div>
            </article>

            <footer class="bg-gradient-to-r from-amber-100 to-orange-100 rounded-3xl p-6 flex items-center justify-center gap-4 text-center border border-amber-200">
                <i data-lucide="sparkles" class="text-amber-500 animate-pulse"></i>
                <div>
                    <h4 class="text-xl font-bold text-amber-900">Great job today!</h4>
                    <p class="text-amber-800 text-sm">Keep practicing, you're doing amazing!</p>
                </div>
            </footer>
        </div>
    </main>

    <script>
        const phonicsData = {
            'G': { songId: 'P41e1otuwQQ', bookId: 'rdNL_qbTgZ8', color: 'bg-red-400', ring: 'ring-red-200' },
            'O': { songId: 'FPa-3VXg6aE', bookId: 'qNY44jqo4jU', color: 'bg-orange-400', ring: 'ring-orange-200' },
            'U': { songId: 'Z4Hp2Z_dgRE', bookId: 'PhmbES7LNv8', color: 'bg-yellow-400', ring: 'ring-yellow-200' },
            'L': { songId: 'TOBufxwa4v8', bookId: '2CQukvtn7ZI', color: 'bg-green-400', ring: 'ring-green-200' },
            'F': { songId: 'htzpOmcGLEs', bookId: 'sLO1IKmqdmw', color: 'bg-blue-400', ring: 'ring-blue-200' },
            'B': { songId: 'dvueijPV6ro', bookId: 'RWw5QKpBa4k', color: 'bg-purple-400', ring: 'ring-purple-200' },
        };

        function updateUI(letter) {
            const data = phonicsData[letter];
            const display = document.getElementById('currentLetterDisplay');
            
            display.textContent = letter;
            display.className = `px-6 py-2 rounded-2xl text-white shadow-xl ${data.color}`;
            
            document.getElementById('songFrame').src = `https://www.youtube.com/embed/${data.songId}`;
            document.getElementById('bookFrame').src = `https://www.youtube.com/embed/${data.bookId}`;

            document.querySelectorAll('.letter-btn').forEach(btn => {
                const btnLetter = btn.getAttribute('data-letter');
                if (btnLetter === letter) {
                    btn.className = `letter-btn w-14 h-14 md:w-16 md:h-16 rounded-2xl text-2xl font-bold transition-all duration-300 shadow-lg flex items-center justify-center transform scale-105 ${phonicsData[btnLetter].color} text-white ring-4 ${phonicsData[btnLetter].ring}`;
                } else {
                    btn.className = 'letter-btn w-14 h-14 md:w-16 md:h-16 rounded-2xl text-2xl font-bold transition-all duration-300 shadow-sm flex items-center justify-center transform hover:scale-105 bg-white border-2 border-slate-200 text-slate-400 hover:border-slate-300 hover:text-slate-600';
                }
            });
        }

        const selector = document.getElementById('letterSelector');
        Object.keys(phonicsData).forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn w-14 h-14 md:w-16 md:h-16 rounded-2xl text-2xl font-bold transition-all duration-300 shadow-sm flex items-center justify-center transform hover:scale-105 bg-white border-2 border-slate-200 text-slate-400 hover:border-slate-300 hover:text-slate-600';
            btn.textContent = letter;
            btn.setAttribute('data-letter', letter);
            btn.onclick = () => updateUI(letter);
            selector.appendChild(btn);
        });

        lucide.createIcons();
        updateUI('G');
    </script>
</body>
</html>
