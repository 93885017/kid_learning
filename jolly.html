<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Phonics Routine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for the letter selector */
        #letterSelector::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        #letterSelector::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 8px;
        }
        #letterSelector::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 8px;
        }
        #letterSelector::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-12 selection:bg-blue-100">

    <header class="bg-white shadow-sm py-6 px-6 mb-8 text-center border-b-4 border-blue-400">
        <h1 class="text-3xl font-extrabold text-slate-800 flex items-center justify-center gap-2">
            <i data-lucide="star" class="text-yellow-400 fill-yellow-400"></i>
            Phonics Daily
        </h1>
        <p class="text-slate-500 mt-2 font-medium">Select a letter or sound to begin today's adventure!</p>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        <section class="mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-sm uppercase tracking-widest font-bold mb-4 text-center text-slate-400">Choose a Letter / Sound</h2>
            <div id="letterSelector" class="flex flex-wrap justify-center gap-2 md:gap-3 max-h-64 overflow-y-auto p-2"></div>
        </section>

        <div class="space-y-8">
            <div class="text-center">
                <h2 class="text-5xl font-black text-slate-800 flex items-center justify-center gap-3">
                    Sound <span id="currentLetterDisplay" class="px-6 py-2 rounded-2xl text-white shadow-xl bg-rose-500">a</span>
                </h2>
            </div>

            <article id="songSection" class="bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-100">
                <div class="bg-blue-50 py-4 px-6 flex items-center gap-3">
                    <div class="p-2 bg-blue-100 rounded-lg text-blue-600"><i data-lucide="music"></i></div>
                    <h3 class="text-xl font-bold text-blue-900">Step 1: Sing the Song</h3>
                </div>
                <div class="p-6">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-inner bg-slate-100">
                        <iframe id="songFrame" class="absolute top-0 left-0 w-full h-full" src="" title="Song" allowFullScreen></iframe>
                    </div>
                    <a id="songLink" href="#" target="_blank" rel="noopener noreferrer" class="mt-4 inline-flex items-center justify-center w-full py-3 px-4 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-xl font-semibold transition-colors shadow-sm">
                        Watch Song on YouTube App
                    </a>
                </div>
            </article>

            <article id="bookSection" class="bg-white rounded-3xl overflow-hidden shadow-lg border border-slate-100">
                <div class="bg-emerald-50 py-4 px-6 flex items-center gap-3">
                    <div class="p-2 bg-emerald-100 rounded-lg text-emerald-600"><i data-lucide="book-open"></i></div>
                    <h3 class="text-xl font-bold text-emerald-900">Step 2: Watch the Story</h3>
                </div>
                <div class="p-6">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden shadow-inner bg-slate-100">
                        <iframe id="bookFrame" class="absolute top-0 left-0 w-full h-full" src="" title="Story" allowFullScreen></iframe>
                    </div>
                    <a id="bookLink" href="#" target="_blank" rel="noopener noreferrer" class="mt-4 inline-flex items-center justify-center w-full py-3 px-4 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-xl font-semibold transition-colors shadow-sm">
                        Watch Story on YouTube App
                    </a>
                </div>
            </article>

            <footer class="bg-gradient-to-r from-amber-100 to-orange-100 rounded-3xl p-6 flex items-center justify-center gap-4 text-center border border-amber-200">
                <i data-lucide="sparkles" class="text-amber-500 animate-pulse w-10 h-10"></i>
                <div>
                    <h4 class="text-xl font-bold text-amber-900">Great job today!</h4>
                    <p class="text-amber-800 text-sm">Keep practicing, you're doing amazing!</p>
                </div>
            </footer>
        </div>
    </main>

    <script>
        // Exact 36 active sounds mapped with 1 song and 1 story from your verified table
        const phonicsData = {
            'a': { songId: 'wUi8zdYpr6E', bookId: 'pIZMSibjw7k', color: 'bg-rose-500', ring: 'ring-rose-200' },
            'ai': { songId: 'b7PKUE8aL4s', bookId: 'YoVMAk1BMbU', color: 'bg-red-500', ring: 'ring-red-200' },
            'b': { songId: 'ciuQq89n2Mk', bookId: 'p8jFVaaiCro', color: 'bg-orange-500', ring: 'ring-orange-200' },
            'c / k': { songId: 'ZXBxUCdUJrA', bookId: 'E24Pfa2-lEE', color: 'bg-amber-500', ring: 'ring-amber-200' },
            'ch': { songId: '5H58z_QVm-w', bookId: 'OHWzW2Yz_lg', color: 'bg-yellow-500', ring: 'ring-yellow-200' },
            'd': { songId: 'JEpBGhRB2LE', bookId: 'Qq2sILz4Vto', color: 'bg-lime-500', ring: 'ring-lime-200' },
            'e': { songId: 'CTcsDauRaEk', bookId: 'lFEfGhMsofI', color: 'bg-green-500', ring: 'ring-green-200' },
            'ee / or': { songId: 'SWfx4C-oA9g', bookId: '-pcbz1WXX8Y', color: 'bg-emerald-500', ring: 'ring-emerald-200' },
            'er': { songId: 'VskkuZ18wZ8', bookId: 'dyRXPLMZx1I', color: 'bg-teal-500', ring: 'ring-teal-200' },
            'f': { songId: 'i1f6H2OJzSg', bookId: 'viQ3oEle2-k', color: 'bg-cyan-500', ring: 'ring-cyan-200' },
            'g': { songId: 'vHAn45hdNHA', bookId: 'iEXo_hb9-r0', color: 'bg-sky-500', ring: 'ring-sky-200' },
            'h': { songId: '2by7CHypj5A', bookId: 'xtT4aIIJdII', color: 'bg-blue-500', ring: 'ring-blue-200' },
            'i': { songId: 'eMU-J88bt1Q', bookId: 'vcCPx70IpEA', color: 'bg-indigo-500', ring: 'ring-indigo-200' },
            'ie': { songId: 'SKv2Xwmzoj0', bookId: 'P9TWj-_Co0k', color: 'bg-violet-500', ring: 'ring-violet-200' },
            'j': { songId: 'hHbTRh1TULs', bookId: '8xNTyHa-_MY', color: 'bg-purple-500', ring: 'ring-purple-200' },
            'l': { songId: 'QllJeg6DlM8', bookId: 'bYNDcdj852Q', color: 'bg-fuchsia-500', ring: 'ring-fuchsia-200' },
            'm': { songId: 'JSV-TAlSgt8', bookId: '1ParIb1fqKo', color: 'bg-pink-500', ring: 'ring-pink-200' },
            'n': { songId: 'J7FVg2Sic2s', bookId: 'PvyTCoBVGOE', color: 'bg-rose-400', ring: 'ring-rose-200' },
            'ng': { songId: '27K5t7YaFcY', bookId: 'qIarSNiUkr0', color: 'bg-red-400', ring: 'ring-red-200' },
            'o': { songId: 'zDmtHnIxjmI', bookId: 'uRomEEt7pzo', color: 'bg-orange-400', ring: 'ring-orange-200' },
            'oa': { songId: 'bMzyyw7HgMU', bookId: 'idlcV09oJlU', color: 'bg-amber-400', ring: 'ring-amber-200' },
            'oo': { songId: 'gd6rvzc_Nhs', bookId: 'Tv6B5ohgGqk', color: 'bg-yellow-400', ring: 'ring-yellow-200' },
            'ou': { songId: 'kPJZ9MGi-O8', bookId: '5aJPNzkc6J0', color: 'bg-lime-400', ring: 'ring-lime-200' },
            'p': { songId: 'Lr_ElKRc348', bookId: 'pLvC9-SvIfA', color: 'bg-green-400', ring: 'ring-green-200' },
            'qu': { songId: 'aurzlkmeuPc', bookId: 'z_8jX94zVfI', color: 'bg-emerald-400', ring: 'ring-emerald-200' },
            'r': { songId: '2M1dz6Ez_BI', bookId: 'sI0gVpccjnA', color: 'bg-teal-400', ring: 'ring-teal-200' },
            's': { songId: 'MOR_plE3YI4', bookId: 'rqR6WAS2eQk', color: 'bg-cyan-400', ring: 'ring-cyan-200' },
            'sh': { songId: 'LXY01KIykkI', bookId: 'es-tgnD_rTQ', color: 'bg-sky-400', ring: 'ring-sky-200' },
            't': { songId: '3p6Qr5ZNhqc', bookId: 'rK6-Grv8fKA', color: 'bg-blue-400', ring: 'ring-blue-200' },
            'th': { songId: '--toC1kTAzk', bookId: 'UjaXD2jIq6I', color: 'bg-indigo-400', ring: 'ring-indigo-200' },
            'u': { songId: 'Z4Hp2Z_dgRE', bookId: 'lTpyibZcAbA', color: 'bg-violet-400', ring: 'ring-violet-200' },
            'v': { songId: 'pU2ZYLzJCoY', bookId: 'xCcejbZvqhw', color: 'bg-purple-400', ring: 'ring-purple-200' },
            'w': { songId: 'wceITcIOmEo', bookId: 'qdPuxu1a1xM', color: 'bg-fuchsia-400', ring: 'ring-fuchsia-200' },
            'x': { songId: 'XUjzprQsNSQ', bookId: 'qVjeA6EA3xA', color: 'bg-pink-400', ring: 'ring-pink-200' },
            'y': { songId: '9bMHn0-fYw8', bookId: 'ifuAsmTG0Vc', color: 'bg-rose-600', ring: 'ring-rose-200' },
            'z': { songId: 'AGIx17w5IX8', bookId: 'p0WSvtJy1Ho', color: 'bg-red-600', ring: 'ring-red-200' }
        };

        function updateUI(letter) {
            const data = phonicsData[letter];
            const display = document.getElementById('currentLetterDisplay');
            
            // Update Title
            display.textContent = letter;
            display.className = `px-6 py-2 rounded-2xl text-white shadow-xl ${data.color}`;
            
            // Update Iframes & Direct App Links
            document.getElementById('songFrame').src = `https://www.youtube.com/embed/${data.songId}`;
            document.getElementById('songLink').href = `https://www.youtube.com/watch?v=${data.songId}`;
            
            document.getElementById('bookFrame').src = `https://www.youtube.com/embed/${data.bookId}`;
            document.getElementById('bookLink').href = `https://www.youtube.com/watch?v=${data.bookId}`;

            // Update active state of buttons
            document.querySelectorAll('.letter-btn').forEach(btn => {
                const btnLetter = btn.getAttribute('data-letter');
                if (btnLetter === letter) {
                    btn.className = `letter-btn px-4 h-12 md:h-14 min-w-[3rem] md:min-w-[3.5rem] rounded-2xl text-lg md:text-xl font-bold transition-all duration-300 shadow-lg flex items-center justify-center transform scale-105 ${phonicsData[btnLetter].color} text-white ring-4 ${phonicsData[btnLetter].ring}`;
                } else {
                    btn.className = 'letter-btn px-4 h-12 md:h-14 min-w-[3rem] md:min-w-[3.5rem] rounded-2xl text-lg md:text-xl font-bold transition-all duration-300 shadow-sm flex items-center justify-center transform hover:scale-105 bg-white border-2 border-slate-200 text-slate-500 hover:border-slate-300 hover:text-slate-700';
                }
            });
        }

        const selector = document.getElementById('letterSelector');
        
        // Generate buttons for all 36 active sounds
        Object.keys(phonicsData).forEach(letter => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn px-4 h-12 md:h-14 min-w-[3rem] md:min-w-[3.5rem] rounded-2xl text-lg md:text-xl font-bold transition-all duration-300 shadow-sm flex items-center justify-center transform hover:scale-105 bg-white border-2 border-slate-200 text-slate-500 hover:border-slate-300 hover:text-slate-700';
            btn.textContent = letter;
            btn.setAttribute('data-letter', letter);
            btn.onclick = () => updateUI(letter);
            selector.appendChild(btn);
        });

        // Initialize icons and set default letter
        lucide.createIcons();
        updateUI('a'); 
    </script>
</body>
</html>
